name: Release Readiness

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root
            working-directory: .
            go-version-file: go.mod
          - name: examples-chi
            working-directory: examples/chi
            go-version-file: examples/chi/go.mod
          - name: examples-fiber
            working-directory: examples/fiber
            go-version-file: examples/fiber/go.mod
          - name: examples-gin
            working-directory: examples/gin
            go-version-file: examples/gin/go.mod
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.working-directory }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.go-version-file }}

      - name: Tidy module
        run: go mod tidy

      - name: Assert tidy state
        run: git diff --exit-code -- go.mod go.sum

      - name: List packages
        run: go list ./...

      - name: Run tests
        run: go test ./...
